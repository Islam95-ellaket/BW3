<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="index.css">
</head>

<body>
  <header>

    <nav class="nav">
      <!-- parte sinistra spotify icona -->
      <div class="parte-sinistra">
        <a class="nav-link active" id="spotify" aria-current="page" href="#"><svg xmlns="http://www.w3.org/2000/svg" width="30"
            height="30" fill="currentColor" class="bi bi-spotify" viewBox="0 0 16 16">
            <path
              d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0m3.669 11.538a.5.5 0 0 1-.686.165c-1.879-1.147-4.243-1.407-7.028-.77a.499.499 0 0 1-.222-.973c3.048-.696 5.662-.397 7.77.892a.5.5 0 0 1 .166.686m.979-2.178a.624.624 0 0 1-.858.205c-2.15-1.321-5.428-1.704-7.972-.932a.625.625 0 0 1-.362-1.194c2.905-.881 6.517-.454 8.986 1.063a.624.624 0 0 1 .206.858m.084-2.268C10.154 5.56 5.9 5.419 3.438 6.166a.748.748 0 1 1-.434-1.432c2.825-.857 7.523-.692 10.492 1.07a.747.747 0 1 1-.764 1.288" />
          </svg>Spotify</a>
      </div>


      <!-- icone della home insime al bottone -->

      <div class="home-search">
        <div class="home">
          <button id="home-btn">
            <a class="nav-link" id="casetta" href="#">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-house"
                viewBox="0 0 16 16 ">
                <path
                  d="M8.707 1.5a1 1 0 0 0-1.414 0L.646 8.146a.5.5 0 0 0 .708.708L2 8.207V13.5A1.5 1.5 0 0 0 3.5 15h9a1.5 1.5 0 0 0 1.5-1.5V8.207l.646.647a.5.5 0 0 0 .708-.708L13 5.793V2.5a.5.5 0 0 0-.5-.5h-1a.5.5 0 0 0-.5.5v1.293zM13 7.207V13.5a.5.5 0 0 1-.5.5h-9a.5.5 0 0 1-.5-.5V7.207l5-5z" />
              </svg>
            </a>
          </button>
        </div>


        <!-- parte della ricerca insieme le icone home e upload -->
        <form class="navigation" role="search">
          <div class="icona-cerca">
            <button id="bottone-cerca">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search"
                viewBox="0 0 16 16">
                <path
                  d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0" />
              </svg>
            </button>
          </div>

<!-- la barra di ricerca e icona del upload -->
          <div id="bottone-input">
            <input class="form-control me-2" id="input-cerca" type="search" placeholder="Cosa Vuoi Ascoltare?"
              aria-label="Search" />
            <div class="icona-upload">
              <button id="imagy-upload">
                <img src="open.spotify.com_intl-it__-_Copia-removebg-preview.png" alt="">
              </button>
            </div>
          </div>

        </form>
      </div>


      <!-- parte destra i tre link insieme al bottone  -->
      <div class="parte-destra">
        <ul class="nav justify-content-end">
          <li class="nav-item">
            <a class="nav-link active" id="border-premium" aria-current="page" href="#">Premium Assistenza Scarica </a>
          </li>

          <li class="nav-item">
            <a class="nav-link" id="Installa" href="#">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                class="bi bi-arrow-down-circle" viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                  d="M1 8a7 7 0 1 0 14 0A7 7 0 0 0 1 8m15 0A8 8 0 1 1 0 8a8 8 0 0 1 16 0M8.5 4.5a.5.5 0 0 0-1 0v5.793L5.354 8.146a.5.5 0 1 0-.708.708l3 3a.5.5 0 0 0 .708 0l3-3a.5.5 0 0 0-.708-.708L8.5 10.293z" />
              </svg>Installa App</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="#">iscriviti</a>
          </li>
          <button>Accedi</button>
          
        </ul>

      </div>
    </nav>



  </header>
  <script src="index.js"></script>
</body>

</html>
